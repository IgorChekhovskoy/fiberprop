[project]
name = "fiberprop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4.2",
    "juliacall>=0.9",
    "juliapkg>=0.1",
    "matplotlib>=3.8.4",
    "numba>=0.60.0",
    "numpy>=1.26.4",
    "plotly>=5.22.0",
    "psutil>=7.2.2",
    "pyqt5>=5.1",
    "scipy>=1.13.1",
    "tqdm>=4.66.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fiberprop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
